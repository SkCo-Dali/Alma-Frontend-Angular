name: Mirror to Azure DevOps

# Espejo automatico GitHub -> Azure DevOps (org SkandiaCo / proyecto "Direccion de IA").
# GitHub es la fuente de verdad; el repo de Azure DevOps queda como replica que solo
# escribe este flujo.
#
# Requiere el secret AZDO_PAT: un PAT de Azure DevOps con permiso Code (Read & Write).
# Mientras no exista, el flujo avisa y termina sin error (el espejo simplemente no corre).

on:
  push:                      # instantaneo para la rama donde exista este archivo
  workflow_dispatch:         # boton "Run workflow" (corre desde la rama por defecto)
  schedule:
    # Red de seguridad por si un push no alcanzo a sincronizar: repasa TODAS
    # las ramas y tags. Estaba en */15, pero GitHub factura cada job
    # redondeando al minuto y este tarda ~10s, asi que el costo lo marca la
    # frecuencia y no la duracion: eran ~200 ejecuciones al mes por repo que
    # casi nunca encontraban algo que sincronizar, porque el push ya lo hizo.
    # En 30 dias solo 14 push fallaron entre los dos repos, concentrados en
    # tres episodios. AzDO es replica de respaldo y auditoria (nadie compila
    # desde ahi), asi que pasar el peor desfase de 15 min a 1 hora no cambia
    # nada operativo. Volver a */15 si algun dia se construye desde AzDO.
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: mirror-azdo
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Espejo GitHub -> Azure DevOps
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          GH_TOKEN: ${{ github.token }}
          SRC_REPO: ${{ github.repository }}
          AZDO_ORG: SkandiaCo
          AZDO_PROJECT_ENC: 'Direcci%C3%B3n%20de%20IA'
          AZDO_REPO: alma-frontend
        run: |
          set -euo pipefail
          if [ -z "${AZDO_PAT:-}" ]; then
            echo "::warning::Falta el secret AZDO_PAT (PAT de Azure DevOps con Code Read & Write); el espejo no corre."
            exit 0
          fi
          # Clon espejo del repo de GitHub (todas las ramas y tags)
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${SRC_REPO}.git" src.git
          cd src.git
          # Autenticacion Basic con el PAT via cabecera (evita exponer el PAT en la URL/logs)
          AUTH=$(printf ':%s' "${AZDO_PAT}" | base64 -w0)
          DEST="https://dev.azure.com/${AZDO_ORG}/${AZDO_PROJECT_ENC}/_git/${AZDO_REPO}"
          # Empuja solo ramas y tags (ignora refs/pull/* de GitHub) y poda lo borrado
          git -c http.extraHeader="Authorization: Basic ${AUTH}" \
              push --prune "${DEST}" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          echo "Mirror OK: ${SRC_REPO} -> ${AZDO_REPO}"
