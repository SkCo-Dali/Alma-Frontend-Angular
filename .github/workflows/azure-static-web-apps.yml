name: ALMA Angular Static Web App

on:
  # Un solo deploy por merge: solo el push a la rama del ambiente dispara el
  # build+deploy (misma lógica que tenía el front React; sin trigger de
  # pull_request, que generaba corridas extra al abrir y al cerrar el PR).
  push:
    branches:
      - develop
      - staging
      - main
      # Propuesta visual del área de UX (@skandia/ui): NO toca la SWA de Dev.
      # Se publica en el staging environment "ux" de SkCoAlmaDev, que tiene su
      # propia URL fija y contenido aislado, así los deploys de develop y los
      # de UX ya no se pisan entre sí.
      - alma-ux
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'Development'
        type: choice
        options:
          - Development
          - UAT
          - Production

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Rama -> GitHub Environment -> Static Web App -> secreto con su token:
    #   main    -> Production  -> SkCoAlma     (yellow-coast)    -> AZURE_SWA_TOKEN_PRD
    #   staging -> UAT         -> SkCoAlmaUat  (uatalma)         -> AZURE_SWA_TOKEN_UAT
    #   develop -> Development -> SkCoAlmaDev  (devalma)         -> AZURE_SWA_TOKEN_DEV
    # Los tokens son secretos de REPOSITORIO (no de Environment) para no
    # depender de permisos de admin; el Environment se mantiene por trazabilidad.
    #
    # Excepción: alma-ux usa el mismo build y el mismo token de Development,
    # pero publica en el staging environment "ux" de esa SWA (SWA_ENV=ux) en
    # vez de en producción, para no pisar el deploy de develop.
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'Production' || github.ref_name == 'staging' && 'UAT' || 'Development') }}
    env:
      AMBIENTE: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'Production' || github.ref_name == 'staging' && 'UAT' || 'Development') }}
      # Vacío ⇒ deploy al entorno de producción de la SWA que corresponda.
      SWA_ENV: ${{ github.ref_name == 'alma-ux' && 'ux' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        # La configuración de Angular se elige por ambiente: fileReplacements
        # inyecta clientId / tenantId / apiUrl, así que no hay variables de build.
        run: |
          echo "Ambiente: $AMBIENTE"
          case "$AMBIENTE" in
            Production) npm run build:prd ;;
            UAT)        npm run build:stg ;;
            *)          npm run build:dev ;;
          esac
      - name: Prepare isolation directory for SWA
        run: |
          mkdir _deploy
          cp -r dist/browser/* _deploy/
          cp staticwebapp.config.json _deploy/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AMBIENTE == 'Production' && secrets.AZURE_SWA_TOKEN_PRD || env.AMBIENTE == 'UAT' && secrets.AZURE_SWA_TOKEN_UAT || secrets.AZURE_SWA_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "_deploy" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          skip_app_build: true
          deployment_environment: ${{ env.SWA_ENV }}
